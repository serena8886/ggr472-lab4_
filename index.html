<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GGR472 Lab 4</title>
    <!-- mapbox API -->
    <script src='https://api.mapbox.com/mapbox-gl-js/v3.10.0/mapbox-gl.js'></script>
    <link href='https://api.mapbox.com/mapbox-gl-js/v3.10.0/mapbox-gl.css' rel='stylesheet' />
    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
    <!-- Turf.js -->
    <script src='https://unpkg.com/@turf/turf@7.2.0/turf.min.js'></script>
</head>

<body>

    <!-- MAP CONTAINER -->
    <div id='map' class='map'></div>
    <!-- Legend -->
    <div id='legend'>
        <h4>
            Pedestrian & Cyclist Collisions<br>
        </h4>


        <!-- Gradient colour bar -->
        <div id='legend-bar'></div>

        <!-- Labels: low to high -->
        <div id='legend-labels'>
            <span>Low</span>
            <span>High</span>
        </div>

        <!-- Data source -->
        <p id='legend-source'>
            Source: <a href='https://open.toronto.ca/dataset/motor-vehicle-collisions-involving-killed-or-seriously-injured-persons/' target='_blank'>
                Toronto Open Data</a>
        </p>
    </div>
    <!-- Filter Bar -->
    <div id='filter-bar'>
        <h4>Filter by Collisions</h4>
        <div id='layer-toggle'>
        <label>
            <input type='checkbox' id='hexgrid-toggle' checked />
            Show Hexgrid
        </label>
    </div>

    <label>Min: <span id='filter-value'>0</span></label>
    <input 
        id='collision-filter' 
        type='range' 
        min='0' 
        max='55' 
        step='1' 
        value='0'
    />
    </div>
   <!--Map Script-->
    <script src="script.js"></script>

</body>

</html>
